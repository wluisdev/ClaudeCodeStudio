<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Claude VS</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="app">
        <div class="topbar">
            <div class="brand">
                <span class="logo">✺</span>
                <span>Claude VS</span>
            </div>

            <div class="actions">
                <span>◫</span>
                <span>🔒</span>
                <span>⋯</span>
            </div>
        </div>

        <div class="titlebar">
            Claude Code
        </div>

        <div class="content">
            <div id="messages" class="messages">

                <div class="welcome">

                    <div class="hero">
                        <span class="logo">✺</span>
                        Claude VS
                    </div>

                    <div class="bot">🤖</div>

                    <div class="hint">
                        Type /model to pick the right tool for the job.
                    </div>

                </div>

            </div>
        </div>

        <div class="notice">
            💻 <strong>Prefer the Terminal experience?</strong> Switch back in Settings. ×
        </div>

        <div class="composer">
            <div class="input">
                <textarea placeholder="ctrl esc to focus or unfocus Claude"></textarea>

                <div class="composer-actions">
                    <div class="left-buttons">
                        <span>＋</span>
                        <span>▣</span>
                    </div>

                    <div class="right-buttons">
                        <span class="mode">✋ Ask before edits</span>
                        <button class="send">↑</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
