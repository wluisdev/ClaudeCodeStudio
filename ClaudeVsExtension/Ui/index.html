<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Claude VS</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="app">
        <div class="topbar">
            <div class="brand">
                <span class="logo">✺</span>
                <span>Claude VS</span>
            </div>

            <div class="actions">
                <span>◫</span>
                <span>🔒</span>
                <div class="cmd-wrap" id="cmd-wrap">
                    <button class="cmd-trigger" title="Comandos" onclick="toggleCmdMenu()">⌘</button>
                    <div class="cmd-menu" id="cmd-menu">
                        <div class="cmd-section">Built-in</div>
                        <div class="cmd-item" onclick="runCommand('/usage')">/usage</div>
                        <div class="cmd-item" onclick="runCommand('/compact')">/compact</div>
                        <div class="cmd-item" onclick="runCommand('/review')">/review</div>
                        <div class="cmd-item" onclick="runCommand('/clear')">/clear</div>
                        <div class="cmd-divider"></div>
                        <div class="cmd-section">Custom</div>
                        <div id="custom-cmd-list"></div>
                        <div class="cmd-item cmd-add" onclick="openAddCommand()">＋ Add command…</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="titlebar">
            <span>Claude Code</span>
            <div class="titlebar-right">
                <select class="effort-select" title="Nível de esforço">
                    <option value="">auto</option>
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                    <option value="max">max</option>
                </select>
                <select class="model-select">
                    <option value="claude-sonnet-4-6">Sonnet 4.6</option>
                    <option value="claude-opus-4-7">Opus 4.7</option>
                    <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
                    <option value="claude-3-7-sonnet-20250219">Sonnet 3.7</option>
                    <option value="claude-3-haiku-20240307">Haiku 3</option>
                </select>
                <button class="new-chat" title="Nova conversa">✎</button>
            </div>
        </div>

        <div class="content">
            <div id="messages" class="messages">

                <div class="welcome">

                    <div class="hero">
                        <span class="logo">✺</span>
                        Claude VS
                    </div>

                    <div class="bot">🤖</div>

                    <div class="hint">
                        Type /model to pick the right tool for the job.
                    </div>

                </div>

            </div>
        </div>

        <div class="notice" id="notice">
            💻 <strong>Prefer the Terminal experience?</strong> Switch back in Settings.
            <button class="notice-close" onclick="document.getElementById('notice').remove()">×</button>
        </div>

        <div class="composer">
            <div id="attachments" class="attachments"></div>
            <div class="input">
                <textarea placeholder="ctrl esc to focus or unfocus Claude"></textarea>

                <div class="composer-actions">
                    <div class="left-buttons">
                        <button class="composer-btn" id="btn-paste" title="Colar área de transferência">⎘</button>
                        <button class="composer-btn" id="btn-file" title="Adicionar arquivo">＋</button>
                        <button class="composer-btn" id="btn-selection" title="Inserir seleção do editor">▣</button>
                    </div>

                    <div class="right-buttons">
                        <select class="permission-select" title="Modo de permissão">
                            <option value="auto">⚡ auto</option>
                            <option value="plan">📋 plan</option>
                            <option value="ask">🔒 ask</option>
                        </select>
                        <button class="send">↑</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="cmd-modal-overlay" id="cmd-modal-overlay" onclick="if(event.target===this)closeAddCommand()">
        <div class="cmd-modal">
            <h3>Adicionar comando</h3>
            <label>Nome (exibido no menu)</label>
            <input id="cmd-modal-name" placeholder="Ex: Code Review" onkeydown="if(event.key==='Enter')document.getElementById('cmd-modal-cmd').focus()" />
            <label>Comando (enviado ao Claude)</label>
            <input id="cmd-modal-cmd" placeholder="Ex: /review" onkeydown="if(event.key==='Enter')saveNewCommand()" />
            <div class="cmd-modal-buttons">
                <button onclick="closeAddCommand()">Cancelar</button>
                <button class="btn-primary" onclick="saveNewCommand()">Adicionar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
